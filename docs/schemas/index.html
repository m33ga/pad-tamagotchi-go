<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tamagotchi Go API Docs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.15/swagger-ui.css">
    <style>
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *:before, *:after { box-sizing: inherit; }
      body { margin: 0; background: #fafafa; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.15/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.15/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          urls: [
            { url: "user-management-service.json", name: "User Management Service" },
            { url: "tamagotchi-service.json", name: "Tamagotchi Service" },
            { url: "battle-service.json", name: "Battle Service" },
            { url: "map-service.json", name: "Map Service" },
            { url: "guild-service.json", name: "Guild Service" },
            { url: "monster-raid-service.json", name: "Monster Raid Service" },
            { url: "package-registry-service.json", name: "Package Registry Service" },
            { url: "notification-service.json", name: "Notification Service" }
          ],
          "urls.primaryName": "User Management Service",
          deepLinking: true,
          dom_id: "#swagger-ui",
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout"
        });
      };
    </script>
  </body>
</html>
