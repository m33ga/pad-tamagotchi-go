services:
  api-gateway:
    image: grdz/gateway:2.0.1
    pull_policy: always
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    volumes:
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    depends_on:
      user-management-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  user-management-api:
    image: sanda2004/user-management-service:2.0.0
    pull_policy: always
    env_file:
      - .env
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}:/run/secrets/jwt-private.pem:ro
      - ./config/service-clients.yaml:/app/config/service-clients.yaml:ro
    depends_on:
      user-management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-management-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
    volumes:
      - user-management-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  battle-api:
    image: sanda2004/battle-service:2.0.0
    pull_policy: always
    env_file:
      - .env
      - ./secrets/battle-service.env
    depends_on:
      battle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  battle-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${BATTLE_DB_NAME}
      POSTGRES_USER: ${BATTLE_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD}
    volumes:
      - battle-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  map-api:
    image: grdz/map-service:2.0.4
    pull_policy: always
    env_file:
      - .env
      - ./secrets/map-service.env
    environment:
      REDIS_ADDR: map-redis:6379
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
    depends_on:
      map-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  map-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${MAP_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  monster-raid-api:
    image: grdz/monster-raid-service:2.0.4
    pull_policy: always
    env_file:
      - .env
      - ./secrets/monster-raid-service.env
    environment:
      POSTGRES_HOST: monster-raid-db
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
      REDIS_ADDR: monster-raid-redis:6379
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD}
    depends_on:
      monster-raid-db:
        condition: service_healthy
      monster-raid-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  monster-raid-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
    volumes:
      - monster-raid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  monster-raid-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${MONSTER_RAID_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MONSTER_RAID_REDIS_PASSWORD}
    volumes:
      - monster-raid-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  guild-api:
    image: cosmak47/pad-guild-service:2.0.0
    pull_policy: always
    env_file:
      - .env
      - ./secrets/guild-service.env
    environment:
      PORT: "8081"
      WS_PORT: "8082"
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL:-ws://localhost:8081}
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      MOCK_EXTERNAL_SERVICES: "false"
    ports:
      - "${GUILD_CHAT_PORT:-8081}:8082"
    depends_on:
      guild-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  guild-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${GUILD_DB_NAME}
      POSTGRES_USER: ${GUILD_DB_USER}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD}
    volumes:
      - guild-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  package-registry-api:
    image: cosmak47/pad-package-registry-service:2.0.0
    pull_policy: always
    env_file:
      - .env
      - ./secrets/package-registry-service.env
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${PACKAGE_REGISTRY_DB_USER}:${PACKAGE_REGISTRY_DB_PASSWORD}@package-registry-db:5432/${PACKAGE_REGISTRY_DB_NAME}?sslmode=disable
    depends_on:
      package-registry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  package-registry-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD}
    volumes:
      - package-registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  tamagotchi-api:
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-tamagotchi-service:v2.0.2
    pull_policy: always
    # Reachable only through the gateway: no published port. The client
    # credentials come from this service's own secrets file.
    env_file:
      - .env
      - ./secrets/tamagotchi-service.env
    environment:
      POSTGRES_HOST: tamagotchi-db
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: ${TAMAGOTCHI_REQUEST_TIMEOUT_SECONDS:-4}
      PackageRegistry__UseMock: ${USE_MOCK_PACKAGE_REGISTRY:-false}
    depends_on:
      tamagotchi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tamagotchi-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
    volumes:
      - tamagotchi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-api:
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-notification-service:v2.0.3
    pull_policy: always
    # Reachable only through the gateway: no published port. The client
    # credentials come from this service's own secrets file.
    env_file:
      - .env
      - ./secrets/notification-service.env
    environment:
      POSTGRES_HOST: notification-db
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      REDIS_ADDR: notification-redis:6379
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD}
      REQUEST_TIMEOUT_SECONDS: ${NOTIFICATION_REQUEST_TIMEOUT_SECONDS:-4}
    depends_on:
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${NOTIFICATION_REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${NOTIFICATION_REDIS_PASSWORD}
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  user-management-data:
  battle-data:
  map-redis-data:
  monster-raid-data:
  monster-raid-redis-data:
  guild-data:
  package-registry-data:
  tamagotchi-data:
  notification-data:
  notification-redis-data:
