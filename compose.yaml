# Every container logs through the json-file driver, rotated, with its name as tag: the
# OpenTelemetry Collector reads these files (Docker Desktop defaults to the local driver, which
# it cannot read) and sends the lines to Loki.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# PostgreSQL nodes are independent failure domains; the DCS quorum lives in etcd.
x-patroni: &patroni
  logging: *default-logging
  image: grdz/patroni:5.0.0
  build:
    context: ./infra/patroni
  networks: [internal]
  # A crash stays down for the failover demonstration; Patroni supervises PostgreSQL.
  restart: "no"
  cpus: 0.5
  mem_limit: 256M
  shm_size: 64M
  stop_grace_period: 30s
  environment: &patroni-environment
    PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:?}
    PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:?}
    PATRONI_API_PASSWORD: ${PATRONI_API_PASSWORD:?}
    ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD:?}
    POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?}
  depends_on:
    etcd-1:
      condition: service_healthy
    etcd-2:
      condition: service_healthy
    etcd-3:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/readiness', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 15s

x-database-proxy: &database-proxy
  logging: *default-logging
  image: haproxy:3.2.27-alpine
  networks: [internal]
  restart: unless-stopped
  cpus: 0.25
  mem_limit: 64M
  volumes:
    - ./infra/haproxy/postgres.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/health"]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 15s

x-postgres-exporter: &postgres-exporter
  logging: *default-logging
  image: prometheuscommunity/postgres-exporter:v0.21.1
  networks: [internal]
  restart: unless-stopped
  cpus: 0.1
  mem_limit: 64M
  command: ["--extend.query-path=/etc/postgres-exporter/queries.yaml"]
  volumes:
    - ./observability/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro

x-etcd: &etcd
  logging: *default-logging
  image: quay.io/coreos/etcd:v3.6.17
  networks: [internal]
  restart: unless-stopped
  cpus: 0.5
  mem_limit: 128M
  command:
    - /usr/local/bin/etcd
    - --data-dir=/etcd-data
    - --listen-client-urls=http://0.0.0.0:2379
    - --listen-peer-urls=http://0.0.0.0:2380
    - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
    - --initial-cluster-token=pad-postgresql
    - --initial-cluster-state=new
    - --auto-compaction-retention=1h
    - --quota-backend-bytes=134217728
  healthcheck:
    test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  etcd-1:
    <<: *etcd
    hostname: etcd-1
    environment:
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
    volumes:
      - etcd-1-data:/etcd-data

  etcd-2:
    <<: *etcd
    hostname: etcd-2
    environment:
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
    volumes:
      - etcd-2-data:/etcd-data

  etcd-3:
    <<: *etcd
    hostname: etcd-3
    environment:
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
    volumes:
      - etcd-3-data:/etcd-data

  api-gateway:
    logging: *default-logging
    image: grdz/gateway:4.3.1
    pull_policy: always
    # Client traffic arrives on edge; the services and the registry are on internal.
    networks: [edge, internal]
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    volumes:
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    # The api-gateway client credentials, with which the gateway authenticates its
    # Send calls so that the broker accepts the user identity it passes on.
    env_file:
      - .env
      - ./secrets/api-gateway.env
    # Every request goes to the broker, which picks the instance; the gateway keeps
    # no instance list and reaches the broker at broker:9090.
    depends_on:
      service-discovery:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  service-discovery:
    logging: *default-logging
    image: grdz/service-discovery:4.1.1
    pull_policy: always
    restart: unless-stopped
    # Nothing calls it from outside. It joins edge only to reach the Discord webhook,
    # because the internal network has no route to the internet, and its port is
    # bound to loopback so the catalogue can be read from the host and nowhere else.
    networks: [edge, internal]
    ports:
      - "127.0.0.1:8500:8080"
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LOAD_ALERT_THRESHOLD: ${LOAD_ALERT_THRESHOLD:-0.8}
      SELF_PRESERVATION: ${SELF_PRESERVATION:-off}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Not optional: there is no heartbeat, so a registry that loses its state file
    # loses the fleet until every service is restarted.
    volumes:
      - service-discovery-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  broker:
    logging: *default-logging
    image: grdz/broker:4.5.1
    pull_policy: always
    restart: unless-stopped
    # Carries every client request, every call between services and every event:
    # gRPC on 9090 and health, status and admin on 8080, both on the internal network.
    # It joins edge only to publish its admin endpoints (/status, /topics,
    # /dead-letters), bound to loopback so they can be read from the host and
    # nowhere else.
    networks: [internal, edge]
    ports:
      - "127.0.0.1:8501:8080"
    environment:
      BROKER_DATABASE_URL: postgresql://${BROKER_DB_USER}:${BROKER_DB_PASSWORD}@broker-db:5432/${BROKER_DB_NAME}
    depends_on:
      service-discovery:
        condition: service_healthy
      broker-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The durable event store: queued events survive a broker restart.
  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  broker-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: broker-db-1
      DB_NODE_2: broker-db-2
    depends_on:
      broker-db-1:
        condition: service_healthy
      broker-db-2:
        condition: service_healthy

  broker-db-1:
    <<: *patroni
    hostname: broker-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: broker
      PATRONI_NAME: broker-db-1
      POSTGRES_DB: ${BROKER_DB_NAME}
      POSTGRES_USER: ${BROKER_DB_USER}
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD}
    volumes:
      - broker-db-1-data:/var/lib/postgresql/data

  broker-db-2:
    <<: *patroni
    hostname: broker-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: broker
      PATRONI_NAME: broker-db-2
      POSTGRES_DB: ${BROKER_DB_NAME}
      POSTGRES_USER: ${BROKER_DB_USER}
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD}
    volumes:
      - broker-db-2-data:/var/lib/postgresql/data

  broker-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: broker-db:5432/${BROKER_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      broker-db:
        condition: service_healthy

  user-management-api:
    logging: *default-logging
    image: sanda2004/user-management-service:4.1.0
    pull_policy: always
    deploy:
      replicas: 2
    networks: [internal]
    environment:
      REQUEST_TIMEOUT_SECONDS: 4
      OTEL_SERVICE_NAME: user-management
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    env_file:
      - .env
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}:/run/secrets/jwt-private.pem:ro
      - ./config/service-clients.yaml:/app/config/service-clients.yaml:ro
    depends_on:
      service-discovery:
        condition: service_healthy
      user-management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  user-management-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: user-management-db-1
      DB_NODE_2: user-management-db-2
    depends_on:
      user-management-db-1:
        condition: service_healthy
      user-management-db-2:
        condition: service_healthy

  user-management-db-1:
    <<: *patroni
    hostname: user-management-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: user-management
      PATRONI_NAME: user-management-db-1
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
    volumes:
      - user-management-db-1-data:/var/lib/postgresql/data

  user-management-db-2:
    <<: *patroni
    hostname: user-management-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: user-management
      PATRONI_NAME: user-management-db-2
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
    volumes:
      - user-management-db-2-data:/var/lib/postgresql/data

  user-management-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: user-management-db:5432/${USER_MANAGEMENT_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      user-management-db:
        condition: service_healthy

  battle-api:
    logging: *default-logging
    image: sanda2004/battle-service:4.0.2
    pull_policy: always
    deploy:
      replicas: 2
    networks: [internal]
    environment:
      REQUEST_TIMEOUT_SECONDS: 4
      OTEL_SERVICE_NAME: battle
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      USER_MANAGEMENT_PROTOCOL: grpc
      TAMAGOTCHI_PROTOCOL: grpc
      PACKAGE_REGISTRY_PROTOCOL: grpc
    env_file:
      - .env
      - ./secrets/battle-service.env
    depends_on:
      service-discovery:
        condition: service_healthy
      battle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  battle-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: battle-db-1
      DB_NODE_2: battle-db-2
    depends_on:
      battle-db-1:
        condition: service_healthy
      battle-db-2:
        condition: service_healthy

  battle-db-1:
    <<: *patroni
    hostname: battle-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: battle
      PATRONI_NAME: battle-db-1
      POSTGRES_DB: ${BATTLE_DB_NAME}
      POSTGRES_USER: ${BATTLE_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD}
    volumes:
      - battle-db-1-data:/var/lib/postgresql/data

  battle-db-2:
    <<: *patroni
    hostname: battle-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: battle
      PATRONI_NAME: battle-db-2
      POSTGRES_DB: ${BATTLE_DB_NAME}
      POSTGRES_USER: ${BATTLE_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD}
    volumes:
      - battle-db-2-data:/var/lib/postgresql/data

  battle-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: battle-db:5432/${BATTLE_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      battle-db:
        condition: service_healthy

  map-api:
    logging: *default-logging
    image: grdz/map-service:4.3.0
    pull_policy: always
    # Three interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    deploy:
      replicas: 3
    networks: [internal]
    env_file:
      - .env
      - ./secrets/map-service.env
    environment:
      REDIS_ADDR: map-redis:6379
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
      # The pinned User Management release serves gRPC through Broker.Send.
      USER_MANAGEMENT_TRANSPORT: grpc
    depends_on:
      service-discovery:
        condition: service_healthy
      broker:
        condition: service_healthy
      map-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  map-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks: [internal]
    command: ["redis-server", "--requirepass", "${MAP_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  monster-raid-api:
    logging: *default-logging
    image: grdz/monster-raid-service:4.4.1
    pull_policy: always
    # Three interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    deploy:
      replicas: 3
    networks: [internal]
    env_file:
      - .env
      - ./secrets/monster-raid-service.env
    environment:
      POSTGRES_HOST: monster-raid-db
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
      REDIS_ADDR: monster-raid-redis:6379
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
      # The pinned peer releases serve gRPC through Broker.Send.
      GUILD_TRANSPORT: grpc
      PACKAGE_REGISTRY_TRANSPORT: grpc
      TAMAGOTCHI_TRANSPORT: grpc
    depends_on:
      service-discovery:
        condition: service_healthy
      broker:
        condition: service_healthy
      monster-raid-db:
        condition: service_healthy
      monster-raid-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  monster-raid-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: monster-raid-db-1
      DB_NODE_2: monster-raid-db-2
    depends_on:
      monster-raid-db-1:
        condition: service_healthy
      monster-raid-db-2:
        condition: service_healthy

  monster-raid-db-1:
    <<: *patroni
    hostname: monster-raid-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: monster-raid
      PATRONI_NAME: monster-raid-db-1
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
    volumes:
      - monster-raid-db-1-data:/var/lib/postgresql/data

  monster-raid-db-2:
    <<: *patroni
    hostname: monster-raid-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: monster-raid
      PATRONI_NAME: monster-raid-db-2
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
    volumes:
      - monster-raid-db-2-data:/var/lib/postgresql/data

  monster-raid-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: monster-raid-db:5432/${MONSTER_RAID_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      monster-raid-db:
        condition: service_healthy

  monster-raid-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks: [internal]
    command: ["redis-server", "--requirepass", "${MONSTER_RAID_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MONSTER_RAID_REDIS_PASSWORD}
    volumes:
      - monster-raid-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  guild-api-1:
    logging: *default-logging
    image: cosmak47/pad-guild-service:4.0.0
    pull_policy: always
    networks: [edge, internal]
    env_file:
      - ./secrets/guild-service.env
    environment:
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL_1:-ws://localhost:${GUILD_CHAT_PORT_1:-8081}}
      REQUEST_TIMEOUT_SECONDS: 4
    ports:
      - "${GUILD_CHAT_PORT_1:-8081}:8082"
    depends_on:
      guild-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  guild-api-2:
    logging: *default-logging
    image: cosmak47/pad-guild-service:4.0.0
    pull_policy: always
    networks: [edge, internal]
    env_file:
      - ./secrets/guild-service.env
    environment:
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL_2:-ws://localhost:${GUILD_CHAT_PORT_2:-8083}}
      REQUEST_TIMEOUT_SECONDS: 4
    ports:
      - "${GUILD_CHAT_PORT_2:-8083}:8082"
    depends_on:
      guild-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  guild-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: guild-db-1
      DB_NODE_2: guild-db-2
    depends_on:
      guild-db-1:
        condition: service_healthy
      guild-db-2:
        condition: service_healthy

  guild-db-1:
    <<: *patroni
    hostname: guild-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: guild
      PATRONI_NAME: guild-db-1
      POSTGRES_DB: ${GUILD_DB_NAME}
      POSTGRES_USER: ${GUILD_DB_USER}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD}
    volumes:
      - guild-db-1-data:/var/lib/postgresql/data

  guild-db-2:
    <<: *patroni
    hostname: guild-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: guild
      PATRONI_NAME: guild-db-2
      POSTGRES_DB: ${GUILD_DB_NAME}
      POSTGRES_USER: ${GUILD_DB_USER}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD}
    volumes:
      - guild-db-2-data:/var/lib/postgresql/data

  guild-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      guild-db:
        condition: service_healthy

  package-registry-api:
    logging: *default-logging
    image: cosmak47/pad-package-registry-service:4.0.0
    pull_policy: always
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - ./secrets/package-registry-service.env
    environment:
      DATABASE_URL: postgres://${PACKAGE_REGISTRY_DB_USER}:${PACKAGE_REGISTRY_DB_PASSWORD}@package-registry-db:5432/${PACKAGE_REGISTRY_DB_NAME}?sslmode=disable
      ADMIN_USER_IDS: ${PACKAGE_REGISTRY_ADMIN_USER_IDS:-}
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      package-registry-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  package-registry-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: package-registry-db-1
      DB_NODE_2: package-registry-db-2
    depends_on:
      package-registry-db-1:
        condition: service_healthy
      package-registry-db-2:
        condition: service_healthy

  package-registry-db-1:
    <<: *patroni
    hostname: package-registry-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: package-registry
      PATRONI_NAME: package-registry-db-1
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD}
    volumes:
      - package-registry-db-1-data:/var/lib/postgresql/data

  package-registry-db-2:
    <<: *patroni
    hostname: package-registry-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: package-registry
      PATRONI_NAME: package-registry-db-2
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD}
    volumes:
      - package-registry-db-2-data:/var/lib/postgresql/data

  package-registry-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: package-registry-db:5432/${PACKAGE_REGISTRY_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      package-registry-db:
        condition: service_healthy

  tamagotchi-api:
    logging: *default-logging
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-tamagotchi-service:v4.2.0
    pull_policy: always
    # Two interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    # The client credentials come from this service's own secrets file.
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - .env
      - ./secrets/tamagotchi-service.env
    environment:
      POSTGRES_HOST: tamagotchi-db
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
      # false, the default: health statistics are validated with Package Registry's
      # ListStatDefinitions over gRPC through the broker; true keeps the built-in mock.
      PackageRegistry__UseMock: ${USE_MOCK_PACKAGE_REGISTRY:-false}
    depends_on:
      service-discovery:
        condition: service_healthy
      tamagotchi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  tamagotchi-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: tamagotchi-db-1
      DB_NODE_2: tamagotchi-db-2
    depends_on:
      tamagotchi-db-1:
        condition: service_healthy
      tamagotchi-db-2:
        condition: service_healthy

  tamagotchi-db-1:
    <<: *patroni
    hostname: tamagotchi-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: tamagotchi
      PATRONI_NAME: tamagotchi-db-1
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
    volumes:
      - tamagotchi-db-1-data:/var/lib/postgresql/data

  tamagotchi-db-2:
    <<: *patroni
    hostname: tamagotchi-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: tamagotchi
      PATRONI_NAME: tamagotchi-db-2
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
    volumes:
      - tamagotchi-db-2-data:/var/lib/postgresql/data

  tamagotchi-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: tamagotchi-db:5432/${TAMAGOTCHI_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      tamagotchi-db:
        condition: service_healthy

  notification-api:
    logging: *default-logging
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-notification-service:v4.2.0
    pull_policy: always
    # Two interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    # The client credentials come from this service's own secrets file.
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - .env
      - ./secrets/notification-service.env
    environment:
      POSTGRES_HOST: notification-db
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      REDIS_ADDR: notification-redis:6379
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD}
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      service-discovery:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Stable application address: :5432 primary, :5433 replica (primary fallback).
  notification-db:
    <<: *database-proxy
    environment:
      DB_NODE_1: notification-db-1
      DB_NODE_2: notification-db-2
    depends_on:
      notification-db-1:
        condition: service_healthy
      notification-db-2:
        condition: service_healthy

  notification-db-1:
    <<: *patroni
    hostname: notification-db-1
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: notification
      PATRONI_NAME: notification-db-1
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-db-1-data:/var/lib/postgresql/data

  notification-db-2:
    <<: *patroni
    hostname: notification-db-2
    environment:
      <<: *patroni-environment
      PATRONI_SCOPE: notification
      PATRONI_NAME: notification-db-2
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-db-2-data:/var/lib/postgresql/data

  notification-db-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: notification-db:5432/${NOTIFICATION_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      notification-db:
        condition: service_healthy

  notification-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks: [internal]
    command: ["redis-server", "--requirepass", "${NOTIFICATION_REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${NOTIFICATION_REDIS_PASSWORD}
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Observability (observability/): the OpenTelemetry Collector receives traces and metrics
  # over OTLP and reads every container's log file, and hands them to Tempo, Prometheus and
  # Loki; Grafana shows all three. Only Grafana is published, on loopback.
  otel-collector:
    logging: *default-logging
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.165.0
    # Root, because only root may read Docker's log files.
    user: "0:0"
    networks: [internal]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # From Git Bash on Windows, run compose with MSYS_NO_PATHCONV=1 so this path is kept.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-collector-data:/var/lib/otelcol
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    logging: *default-logging
    restart: unless-stopped
    image: prom/prometheus:v3.16.0
    networks: [internal]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      # Tempo's metrics generator writes span metrics and the service graph here.
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    logging: *default-logging
    restart: unless-stopped
    image: grafana/loki:3.6.20
    networks: [internal]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 1G

  tempo:
    logging: *default-logging
    restart: unless-stopped
    # Traces, read through Grafana: trace search, TraceQL, Traces Drilldown and the service
    # graph. Internal only; Grafana is its UI.
    image: grafana/tempo:2.10.10
    # The image runs as an unprivileged user that cannot write a fresh named volume.
    user: "0:0"
    networks: [internal]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # No healthcheck: the image has no shell or HTTP client (like Loki's), so dependents wait
    # for it to start and the collector's exporter retries until it accepts spans.
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    logging: *default-logging
    restart: unless-stopped
    image: grafana/grafana:13.2.6
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Anyone on this machine may look, including in Explore, where a log line's traceId opens
      # its trace; saving anything needs the admin login. Grafana is reachable on loopback only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      # The first start on an empty volume runs about 800 database migrations, which takes
      # minutes on a busy machine; failed probes during this window do not count.
      start_period: 10m
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  # Published listeners: the gateway, both Guild sockets, and loopback-only Discovery,
  # broker admin and Grafana.
  edge:
  # Every container. No route to the internet, and nothing on it is published.
  internal:
    internal: true

volumes:
  service-discovery-data:
  map-redis-data:
  monster-raid-redis-data:
  notification-redis-data:
  otel-collector-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  # Lab 5: independent data directories; legacy volumes above are retained.
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  broker-db-1-data:
  broker-db-2-data:
  user-management-db-1-data:
  user-management-db-2-data:
  battle-db-1-data:
  battle-db-2-data:
  monster-raid-db-1-data:
  monster-raid-db-2-data:
  guild-db-1-data:
  guild-db-2-data:
  package-registry-db-1-data:
  package-registry-db-2-data:
  tamagotchi-db-1-data:
  tamagotchi-db-2-data:
  notification-db-1-data:
  notification-db-2-data:
