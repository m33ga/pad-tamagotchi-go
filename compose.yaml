  notification-redis-data:
  notification-redis-replica-data:
  otel-collector-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  clickhouse-data:
  airflow-db-data:
  # Lab 5: independent data directories; legacy volumes above are retained.
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  broker-db-1-data:
  broker-db-2-data:
  user-management-db-1-data:
  user-management-db-2-data:
  battle-db-1-data:
  battle-db-2-data:
  monster-raid-db-1-data:
  monster-raid-db-2-data:
