services:
  api-gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to the published gateway image}
    pull_policy: always
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    volumes:
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    depends_on:
      user-management-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  user-management-api:
    image: sanda2004/user-management-service:2.0.0
    pull_policy: always
    env_file:
      - .env
    volumes:
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./config/service-clients.yaml:/app/config/service-clients.yaml:ro
    depends_on:
      user-management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-management-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
    volumes:
      - user-management-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  battle-api:
    image: sanda2004/battle-service:2.0.0
    pull_policy: always
    env_file:
      - .env
      - ./secrets/battle-service.env
    depends_on:
      battle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  battle-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${BATTLE_DB_NAME}
      POSTGRES_USER: ${BATTLE_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD}
    ports:
      - "${BATTLE_DB_PUBLISHED_PORT:-5434}:5432"
    volumes:
      - battle-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  map-api:
    image: grdz/map-service:1.0.3
    pull_policy: always
    env_file:
      - .env
    environment:
      REDIS_ADDR: map-redis:6379
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
    ports:
      - "${MAP_API_PORT:-5030}:8080"
    depends_on:
      map-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  map-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${MAP_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    ports:
      - "${MAP_REDIS_PUBLISHED_PORT:-6380}:6379"
    volumes:
      - map-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  monster-raid-api:
    image: grdz/monster-raid-service:1.0.3
    pull_policy: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: monster-raid-db
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
      REDIS_ADDR: monster-raid-redis:6379
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD}
    ports:
      - "${MONSTER_RAID_API_PORT:-5040}:8080"
    depends_on:
      monster-raid-db:
        condition: service_healthy
      monster-raid-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  monster-raid-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
    ports:
      - "${MONSTER_RAID_DB_PUBLISHED_PORT:-5435}:5432"
    volumes:
      - monster-raid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  monster-raid-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${MONSTER_RAID_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MONSTER_RAID_REDIS_PASSWORD}
    ports:
      - "${MONSTER_RAID_REDIS_PUBLISHED_PORT:-6381}:6379"
    volumes:
      - monster-raid-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  guild-api:
    image: cosmak47/pad-guild-service:2.0.0
    pull_policy: always
    env_file:
      - ./secrets/guild-service.env
    environment:
      PORT: ${GUILD_API_PORT}
      WS_PORT: ${GUILD_WS_PORT:-8082}
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      GATEWAY_URL: ${GATEWAY_URL:-http://api-gateway:8080}
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL:?Set GUILD_PUBLIC_WS_URL to the client-reachable WebSocket base URL}
      MOCK_EXTERNAL_SERVICES: "false"
      REQUEST_TIMEOUT: ${GUILD_REQUEST_TIMEOUT:-4s}
      MAX_CONCURRENCY: ${GUILD_MAX_CONCURRENCY:-64}
    ports:
      - "${GUILD_WS_PUBLISHED_PORT:-8081}:${GUILD_WS_PORT:-8082}"
    depends_on:
      guild-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:${GUILD_API_PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  guild-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${GUILD_DB_NAME}
      POSTGRES_USER: ${GUILD_DB_USER}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD}
    volumes:
      - guild-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  package-registry-api:
    image: cosmak47/pad-package-registry-service:2.0.0
    pull_policy: always
    env_file:
      - ./secrets/package-registry-service.env
    environment:
      PORT: ${PACKAGE_REGISTRY_API_PORT}
      DATABASE_URL: postgres://${PACKAGE_REGISTRY_DB_USER}:${PACKAGE_REGISTRY_DB_PASSWORD}@package-registry-db:5432/${PACKAGE_REGISTRY_DB_NAME}?sslmode=disable
      GATEWAY_URL: ${GATEWAY_URL:-http://api-gateway:8080}
      ADMIN_USER_IDS: ${PACKAGE_REGISTRY_ADMIN_USER_IDS:-}
      REQUEST_TIMEOUT: ${PACKAGE_REGISTRY_REQUEST_TIMEOUT:-4s}
      MAX_CONCURRENCY: ${PACKAGE_REGISTRY_MAX_CONCURRENCY:-64}
    depends_on:
      package-registry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:${PACKAGE_REGISTRY_API_PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  package-registry-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD}
    volumes:
      - package-registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  tamagotchi-api:
    image: johnnyc05/pad-tamagotchi-service:v1.0.3
    pull_policy: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: tamagotchi-db
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
    ports:
      - "${TAMAGOTCHI_API_PORT:-5050}:8080"
    depends_on:
      tamagotchi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tamagotchi-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
    ports:
      - "${TAMAGOTCHI_DB_PUBLISHED_PORT:-5438}:5432"
    volumes:
      - tamagotchi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-api:
    image: johnnyc05/pad-notification-service:v1.2.1
    pull_policy: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: notification-db
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      REDIS_ADDR: notification-redis:6379
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD}
    ports:
      - "${NOTIFICATION_API_PORT:-5060}:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "${NOTIFICATION_DB_PUBLISHED_PORT:-5439}:5432"
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${NOTIFICATION_REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${NOTIFICATION_REDIS_PASSWORD}
    ports:
      - "${NOTIFICATION_REDIS_PUBLISHED_PORT:-6382}:6379"
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  user-management-data:
  battle-data:
  map-redis-data:
  monster-raid-data:
  monster-raid-redis-data:
  guild-data:
  package-registry-data:
  tamagotchi-data:
  notification-data:
  notification-redis-data:
