services:
  user-management-api:
    image: sanda2004/user-management-service:1.0.1
    pull_policy: always
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=user-management-db;Port=5432;Database=${USER_MANAGEMENT_DB_NAME};Username=${USER_MANAGEMENT_DB_USER};Password=${USER_MANAGEMENT_DB_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      MockPackageRegistry__Available: ${MOCK_PACKAGE_REGISTRY_AVAILABLE:-true}
    ports:
      - "${USER_MANAGEMENT_API_PORT:-5010}:8080"
    depends_on:
      user-management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-management-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
    ports:
      - "${USER_MANAGEMENT_DB_PORT:-5433}:5432"
    volumes:
      - user-management-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  battle-api:
    image: sanda2004/battle-service:1.0.0
    pull_policy: always
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=battle-db;Port=5432;Database=${BATTLE_DB_NAME};Username=${BATTLE_DB_USER};Password=${BATTLE_DB_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "${BATTLE_API_PORT:-5020}:8080"
    depends_on:
      battle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  battle-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${BATTLE_DB_NAME}
      POSTGRES_USER: ${BATTLE_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD}
    ports:
      - "${BATTLE_DB_PORT:-5434}:5432"
    volumes:
      - battle-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  user-management-data:
  battle-data:
