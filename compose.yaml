# Every container logs through the json-file driver, rotated, with its name as tag: the
# OpenTelemetry Collector reads these files (Docker Desktop defaults to the local driver, which
# it cannot read) and sends the lines to Loki.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# PostgreSQL pairs share the etcd quorum but have separate scopes and data volumes.
x-patroni: &patroni
  logging: *default-logging
  image: grdz/patroni:5.0.0
  build:
    context: ./infra/patroni
  networks: [internal]
  # A crash stays down for the failover demonstration; Patroni supervises PostgreSQL.
  restart: "no"
  cpus: 0.5
  mem_limit: 192M
  shm_size: 64M
  stop_grace_period: 30s
  environment: &patroni-environment
    PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:?}
    PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:?}
    ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD:?}
  depends_on:
    etcd-1:
      condition: service_healthy
    etcd-2:
      condition: service_healthy
    etcd-3:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/readiness', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 15s

x-database-proxy: &database-proxy
  logging: *default-logging
  image: haproxy:3.2.27-alpine
  networks: [internal]
  restart: unless-stopped
  cpus: 0.25
  mem_limit: 64M
  volumes:
    - ./infra/haproxy/postgres.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/health"]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 15s

x-etcd: &etcd
  logging: *default-logging
  image: quay.io/coreos/etcd:v3.6.17
  networks: [internal]
  restart: unless-stopped
  cpus: 0.5
  mem_limit: 128M
  command:
    - /usr/local/bin/etcd
    - --data-dir=/etcd-data
    - --listen-client-urls=http://0.0.0.0:2379
    - --listen-peer-urls=http://0.0.0.0:2380
    - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
    - --initial-cluster-token=pad-postgresql
    - --initial-cluster-state=new
    - --auto-compaction-retention=1h
    - --quota-backend-bytes=134217728
  healthcheck:
    test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 5s

# The three Redis Sentinels (README, Replication and Failover) share everything but their name.
# Each watches map-redis, monster-raid-redis and notification-redis as map, monster-raid and
# notification, and promotes a replica when two of them agree a primary is down. The config is
# written on the first start only, into a directory of its own that Sentinel can rewrite: it
# records the current primaries, replicas and peer Sentinels there, so a restarted Sentinel
# resumes where it was. Recreating the container starts from the initial primaries again, and
# the other Sentinels' announcements bring it up to date.
#
# Sentinels and Redis nodes find each other by fixed address (see the internal network), never by
# host name: Docker removes a stopped container's name, and a Sentinel that cannot resolve a dead
# primary stalls on every attempt and stays in TILT, the mode in which it never fails over.
x-sentinel: &sentinel
  logging: *default-logging
  image: redis:8-alpine
  restart: unless-stopped
  networks: [internal]
  # Sentinel enters TILT, and refuses to fail over, when its timer runs more than 2 s late. It needs
  # little CPU but needs it on time: four times the default weight keeps it scheduled when the
  # rest of the stack saturates the machine.
  cpu_shares: 4096
  environment:
    MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
    MONSTER_RAID_REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD}
    NOTIFICATION_REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD}
  command:
    - sh
    - -c
    - |
      set -eu
      conf=/etc/redis-sentinel/sentinel.conf
      monitor() {
        echo "sentinel monitor $$1 $$2 6379 2"
        echo "sentinel auth-pass $$1 $$3"
        echo "sentinel down-after-milliseconds $$1 3000"
        echo "sentinel failover-timeout $$1 10000"
        echo "sentinel parallel-syncs $$1 1"
      }
      if [ ! -f "$$conf" ]; then
        mkdir -p "$$(dirname "$$conf")"
        umask 077
        {
          echo "port 26379"
          echo "protected-mode no"
          monitor map 10.89.200.11 "$$MAP_REDIS_PASSWORD"
          monitor monster-raid 10.89.200.21 "$$MONSTER_RAID_REDIS_PASSWORD"
          monitor notification 10.89.200.31 "$$NOTIFICATION_REDIS_PASSWORD"
        } > "$$conf"
      fi
      exec docker-entrypoint.sh redis-server "$$conf" --sentinel
  depends_on:
    map-redis:
      condition: service_healthy
    monster-raid-redis:
      condition: service_healthy
    notification-redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 5s
    timeout: 5s
    retries: 10
  deploy:
    resources:
      limits:
        memory: 64M

# The broker's response cache nodes (README, Caching): plain Redis, nothing written to disk, the
# least recently used key evicted at the memory cap, and no replica, since a lost node costs
# misses, not data. No password, like the broker's other internal peers: they are reachable on
# the internal network only.
x-cache-node: &cache-node
  logging: *default-logging
  image: redis:8-alpine
  restart: unless-stopped
  networks: [internal]
  command:
    - redis-server
    - --save
    - ""
    - --appendonly
    - "no"
    - --maxmemory
    - 64mb
    - --maxmemory-policy
    - allkeys-lru
    - --protected-mode
    - "no"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 5s
    retries: 10
  deploy:
    resources:
      limits:
        memory: 128M

# The ETL runtime (Analytics in the README): Airflow 3 from the ETL image, LocalExecutor, under
# the analytics profile with the warehouse. Every component shares this configuration. The
# connections are environment variables: the warehouse, and each source's replica on port 5433
# as the read-only analytics_reader.
x-airflow: &airflow
  logging: *default-logging
  image: grdz/etl:5.3.0
  profiles: [analytics]
  networks: [internal]
  restart: unless-stopped
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # The ETL's DAGs run as soon as they are loaded: there is nothing to switch on in the UI.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
    # Shared by every component: the API server signs the tokens the tasks present.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?}
    # Airflow's metrics, and the ETL's own (etl.rows_loaded, etl.freshness_seconds), to the
    # collector over OTLP/HTTP.
    AIRFLOW__METRICS__OTEL_ON: "true"
    AIRFLOW__METRICS__OTEL_HOST: otel-collector
    AIRFLOW__METRICS__OTEL_PORT: "4318"
    AIRFLOW__METRICS__OTEL_SERVICE: airflow
    AIRFLOW__METRICS__OTEL_INTERVAL_MILLISECONDS: "15000"
    AIRFLOW_CONN_CLICKHOUSE: clickhouse://etl:${CLICKHOUSE_PASSWORD}@clickhouse:8123
    AIRFLOW_CONN_USER_MANAGEMENT_REPLICA: postgresql://analytics_reader:${ANALYTICS_READER_PASSWORD}@user-management-db:5433/${USER_MANAGEMENT_DB_NAME}
    AIRFLOW_CONN_BATTLE_REPLICA: postgresql://analytics_reader:${ANALYTICS_READER_PASSWORD}@battle-db:5433/${BATTLE_DB_NAME}
    AIRFLOW_CONN_TAMAGOTCHI_REPLICA: postgresql://analytics_reader:${ANALYTICS_READER_PASSWORD}@tamagotchi-db:5433/${TAMAGOTCHI_DB_NAME}
    AIRFLOW_CONN_GUILD_REPLICA: postgresql://analytics_reader:${ANALYTICS_READER_PASSWORD}@guild-db:5433/${GUILD_DB_NAME}
    AIRFLOW_CONN_PACKAGE_REGISTRY_REPLICA: postgresql://analytics_reader:${ANALYTICS_READER_PASSWORD}@package-registry-db:5433/${PACKAGE_REGISTRY_DB_NAME}
    AIRFLOW_CONN_MONSTER_RAID_REPLICA: postgresql://analytics_reader:${ANALYTICS_READER_PASSWORD}@monster-raid-db:5433/${MONSTER_RAID_DB_NAME}
  depends_on: &airflow-depends-on
    airflow-init:
      condition: service_completed_successfully

services:
  etcd-1:
    <<: *etcd
    hostname: etcd-1
    environment:
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
    volumes:
      - etcd-1-data:/etcd-data

  etcd-2:
    <<: *etcd
    hostname: etcd-2
    environment:
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
    volumes:
      - etcd-2-data:/etcd-data

  etcd-3:
    <<: *etcd
    hostname: etcd-3
    environment:
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
    volumes:
      - etcd-3-data:/etcd-data

  api-gateway:
    logging: *default-logging
    image: grdz/gateway:5.0.0
    pull_policy: always
    # /status reports load as a share of these limits (README, Operational Endpoints).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
    # Client traffic arrives on edge; the services and the registry are on internal.
    networks: [edge, internal]
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    volumes:
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    # The api-gateway client credentials, with which the gateway authenticates its
    # Send calls so that the broker accepts the user identity it passes on.
    env_file:
      - .env
      - ./secrets/api-gateway.env
    # Every request goes to the broker, which picks the instance; the gateway keeps
    # no instance list and reaches the broker at broker:9090.
    depends_on:
      service-discovery:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  service-discovery:
    logging: *default-logging
    image: grdz/service-discovery:5.0.0
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
    restart: unless-stopped
    # Nothing calls it from outside. It joins edge only to reach the Discord webhook,
    # because the internal network has no route to the internet, and its port is
    # bound to loopback so the catalogue can be read from the host and nowhere else.
    networks: [edge, internal]
    ports:
      - "127.0.0.1:8500:8080"
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LOAD_ALERT_THRESHOLD: ${LOAD_ALERT_THRESHOLD:-0.8}
      SELF_PRESERVATION: ${SELF_PRESERVATION:-off}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Not optional: there is no heartbeat, so a registry that loses its state file
    # loses the fleet until every service is restarted.
    volumes:
      - service-discovery-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  broker:
    logging: *default-logging
    image: grdz/broker:5.4.0
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped
    # Carries every client request, every call between services and every event:
    # gRPC on 9090 and health, status and admin on 8080, both on the internal network.
    # It joins edge only to publish its admin endpoints (/status, /topics,
    # /dead-letters), bound to loopback so they can be read from the host and
    # nowhere else.
    networks: [internal, edge]
    ports:
      - "127.0.0.1:8501:8080"
    environment:
      BROKER_DATABASE_URL: postgresql://${BROKER_DB_USER}:${BROKER_DB_PASSWORD}@broker-db:5432/${BROKER_DB_NAME}
      # The response cache (README, Caching), spread over the nodes by the broker's hash ring.
      # A node that is down only costs misses, so the broker waits for the nodes to start, not
      # to be healthy.
      BROKER_CACHE_NODES: cache-1:6379,cache-2:6379,cache-3:6379
    depends_on:
      service-discovery:
        condition: service_healthy
      broker-db:
        condition: service_healthy
      cache-1:
        condition: service_started
      cache-2:
        condition: service_started
      cache-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The durable event store: queued events survive a broker restart.
  broker-db:
    <<: *database-proxy
    environment: {DB_NODE_1: broker-db-1, DB_NODE_2: broker-db-2}
    depends_on:
      broker-db-1: {condition: service_healthy}
      broker-db-2: {condition: service_healthy}

  broker-db-1:
    <<: *patroni
    environment: &broker-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: broker
      POSTGRES_DB: ${BROKER_DB_NAME}
      POSTGRES_USER: ${BROKER_DB_USER}
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD}
      PATRONI_NAME: broker-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: broker-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: broker-db-1:5432
    volumes: [broker-db-1-data:/var/lib/postgresql/data]

  broker-db-2:
    <<: *patroni
    environment:
      <<: *broker-db-environment
      PATRONI_NAME: broker-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: broker-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: broker-db-2:5432
    volumes: [broker-db-2-data:/var/lib/postgresql/data]

  user-management-api:
    logging: *default-logging
    image: sanda2004/user-management-service:5.0.1
    cpus: 1.0
    mem_limit: 512M
    pull_policy: always
    deploy:
      replicas: 2
    networks: [internal]
    environment:
      REQUEST_TIMEOUT_SECONDS: 4
      OTEL_SERVICE_NAME: user-management
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    env_file:
      - .env
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}:/run/secrets/jwt-private.pem:ro
      - ./config/service-clients.yaml:/app/config/service-clients.yaml:ro
    depends_on:
      service-discovery:
        condition: service_healthy
      user-management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-management-db:
    <<: *database-proxy
    environment: {DB_NODE_1: user-management-db-1, DB_NODE_2: user-management-db-2}
    depends_on:
      user-management-db-1: {condition: service_healthy}
      user-management-db-2: {condition: service_healthy}

  user-management-db-1:
    <<: *patroni
    command: ["/etc/patroni/patroni-participant.yml"]
    environment: &user-management-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: user-management
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
      PATRONI_NAME: user-management-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: user-management-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: user-management-db-1:5432
    volumes: [user-management-db-1-data:/var/lib/postgresql/data]

  user-management-db-2:
    <<: *patroni
    command: ["/etc/patroni/patroni-participant.yml"]
    environment:
      <<: *user-management-db-environment
      PATRONI_NAME: user-management-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: user-management-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: user-management-db-2:5432
    volumes: [user-management-db-2-data:/var/lib/postgresql/data]

  battle-api:
    logging: *default-logging
    image: sanda2004/battle-service:5.0.0
    pull_policy: always
    cpus: 1.0
    mem_limit: 512M
    deploy:
      replicas: 2
    networks: [internal]
    environment:
      REQUEST_TIMEOUT_SECONDS: 4
      OTEL_SERVICE_NAME: battle
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      USER_MANAGEMENT_PROTOCOL: grpc
      TAMAGOTCHI_PROTOCOL: grpc
      PACKAGE_REGISTRY_PROTOCOL: grpc
    env_file:
      - .env
      - ./secrets/battle-service.env
    depends_on:
      service-discovery:
        condition: service_healthy
      battle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  battle-db:
    <<: *database-proxy
    environment: {DB_NODE_1: battle-db-1, DB_NODE_2: battle-db-2}
    depends_on:
      battle-db-1: {condition: service_healthy}
      battle-db-2: {condition: service_healthy}

  battle-db-1:
    <<: *patroni
    environment: &battle-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: battle
      POSTGRES_DB: ${BATTLE_DB_NAME}
      POSTGRES_USER: ${BATTLE_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD}
      PATRONI_NAME: battle-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: battle-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: battle-db-1:5432
    volumes: [battle-db-1-data:/var/lib/postgresql/data]

  battle-db-2:
    <<: *patroni
    environment:
      <<: *battle-db-environment
      PATRONI_NAME: battle-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: battle-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: battle-db-2:5432
    volumes: [battle-db-2-data:/var/lib/postgresql/data]

  map-api:
    logging: *default-logging
    image: grdz/map-service:5.0.0
    pull_policy: always
    # Three interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [internal]
    env_file:
      - .env
      - ./secrets/map-service.env
    environment:
      # Redis is found through the Sentinels (README, Replication and Failover): they name the
      # current primary of the group map and announce a new one after a failover.
      MAP_REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      MAP_REDIS_MASTER: map
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
      # The pinned User Management release serves gRPC through Broker.Send.
      USER_MANAGEMENT_TRANSPORT: grpc
    depends_on:
      service-discovery:
        condition: service_healthy
      broker:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The initial primary of the Sentinel group map; map-redis-replica follows it. Either may be
  # the primary after a failover, so both take the same password for clients (requirepass) and
  # for the primary they replicate from (masterauth). Both have a fixed address, which Sentinel
  # names to clients after a failover. No restart policy: a killed primary stays down until it is
  # started again, and Sentinel then turns it into a replica of the promoted one.
  map-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks:
      internal:
        ipv4_address: 10.89.200.11
    command:
      - redis-server
      - --requirepass
      - ${MAP_REDIS_PASSWORD}
      - --masterauth
      - ${MAP_REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  map-redis-replica:
    logging: *default-logging
    image: redis:8-alpine
    networks:
      internal:
        ipv4_address: 10.89.200.12
    command:
      - redis-server
      - --replicaof
      - 10.89.200.11
      - "6379"
      - --requirepass
      - ${MAP_REDIS_PASSWORD}
      - --masterauth
      - ${MAP_REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-replica-data:/data
    depends_on:
      map-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  monster-raid-api:
    logging: *default-logging
    image: grdz/monster-raid-service:5.0.0
    pull_policy: always
    # Three interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [internal]
    env_file:
      - .env
      - ./secrets/monster-raid-service.env
    environment:
      POSTGRES_HOST: monster-raid-db
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
      # Redis is found through the Sentinels under the group name monster-raid.
      REDIS_MODE: sentinel
      REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: monster-raid
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
      # The pinned peer releases serve gRPC through Broker.Send.
      GUILD_TRANSPORT: grpc
      PACKAGE_REGISTRY_TRANSPORT: grpc
      TAMAGOTCHI_TRANSPORT: grpc
    depends_on:
      service-discovery:
        condition: service_healthy
      broker:
        condition: service_healthy
      monster-raid-db:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  monster-raid-db:
    <<: *database-proxy
    environment: {DB_NODE_1: monster-raid-db-1, DB_NODE_2: monster-raid-db-2}
    depends_on:
      monster-raid-db-1: {condition: service_healthy}
      monster-raid-db-2: {condition: service_healthy}

  monster-raid-db-1:
    <<: *patroni
    environment: &monster-raid-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: monster-raid
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
      PATRONI_NAME: monster-raid-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: monster-raid-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: monster-raid-db-1:5432
    volumes: [monster-raid-db-1-data:/var/lib/postgresql/data]

  monster-raid-db-2:
    <<: *patroni
    environment:
      <<: *monster-raid-db-environment
      PATRONI_NAME: monster-raid-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: monster-raid-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: monster-raid-db-2:5432
    volumes: [monster-raid-db-2-data:/var/lib/postgresql/data]

  # The initial primary of the Sentinel group monster-raid, set up like map-redis.
  monster-raid-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks:
      internal:
        ipv4_address: 10.89.200.21
    command:
      - redis-server
      - --requirepass
      - ${MONSTER_RAID_REDIS_PASSWORD}
      - --masterauth
      - ${MONSTER_RAID_REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${MONSTER_RAID_REDIS_PASSWORD}
    volumes:
      - monster-raid-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  monster-raid-redis-replica:
    logging: *default-logging
    image: redis:8-alpine
    networks:
      internal:
        ipv4_address: 10.89.200.22
    command:
      - redis-server
      - --replicaof
      - 10.89.200.21
      - "6379"
      - --requirepass
      - ${MONSTER_RAID_REDIS_PASSWORD}
      - --masterauth
      - ${MONSTER_RAID_REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${MONSTER_RAID_REDIS_PASSWORD}
    volumes:
      - monster-raid-redis-replica-data:/data
    depends_on:
      monster-raid-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  guild-api-1:
    logging: *default-logging
    image: cosmak47/pad-guild-service:5.0.0
    pull_policy: always
    cpus: 0.5
    mem_limit: 256M
    networks: [edge, internal]
    env_file:
      - ./secrets/guild-service.env
    environment:
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL_1:-ws://localhost:${GUILD_CHAT_PORT_1:-8081}}
      REQUEST_TIMEOUT_SECONDS: 4
    ports:
      - "${GUILD_CHAT_PORT_1:-8081}:8082"
    depends_on:
      guild-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  guild-api-2:
    logging: *default-logging
    image: cosmak47/pad-guild-service:5.0.0
    pull_policy: always
    cpus: 0.5
    mem_limit: 256M
    networks: [edge, internal]
    env_file:
      - ./secrets/guild-service.env
    environment:
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL_2:-ws://localhost:${GUILD_CHAT_PORT_2:-8083}}
      REQUEST_TIMEOUT_SECONDS: 4
    ports:
      - "${GUILD_CHAT_PORT_2:-8083}:8082"
    depends_on:
      guild-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  guild-db:
    <<: *database-proxy
    environment: {DB_NODE_1: guild-db-1, DB_NODE_2: guild-db-2}
    depends_on:
      guild-db-1: {condition: service_healthy}
      guild-db-2: {condition: service_healthy}

  guild-db-1:
    <<: *patroni
    environment: &guild-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: guild
      POSTGRES_DB: ${GUILD_DB_NAME}
      POSTGRES_USER: ${GUILD_DB_USER}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD}
      PATRONI_NAME: guild-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: guild-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: guild-db-1:5432
    volumes: [guild-db-1-data:/var/lib/postgresql/data]

  guild-db-2:
    <<: *patroni
    environment:
      <<: *guild-db-environment
      PATRONI_NAME: guild-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: guild-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: guild-db-2:5432
    volumes: [guild-db-2-data:/var/lib/postgresql/data]

  package-registry-api:
    logging: *default-logging
    image: cosmak47/pad-package-registry-service:5.0.0
    pull_policy: always
    cpus: 0.5
    mem_limit: 256M
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - ./secrets/package-registry-service.env
    environment:
      DATABASE_URL: postgres://${PACKAGE_REGISTRY_DB_USER}:${PACKAGE_REGISTRY_DB_PASSWORD}@package-registry-db:5432/${PACKAGE_REGISTRY_DB_NAME}?sslmode=disable
      ADMIN_USER_IDS: ${PACKAGE_REGISTRY_ADMIN_USER_IDS:-}
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      package-registry-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  package-registry-db:
    <<: *database-proxy
    environment: {DB_NODE_1: package-registry-db-1, DB_NODE_2: package-registry-db-2}
    depends_on:
      package-registry-db-1: {condition: service_healthy}
      package-registry-db-2: {condition: service_healthy}

  package-registry-db-1:
    <<: *patroni
    command: ["/etc/patroni/patroni-participant.yml"]
    environment: &package-registry-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: package-registry
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD}
      PATRONI_NAME: package-registry-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: package-registry-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: package-registry-db-1:5432
    volumes: [package-registry-db-1-data:/var/lib/postgresql/data]

  package-registry-db-2:
    <<: *patroni
    command: ["/etc/patroni/patroni-participant.yml"]
    environment:
      <<: *package-registry-db-environment
      PATRONI_NAME: package-registry-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: package-registry-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: package-registry-db-2:5432
    volumes: [package-registry-db-2-data:/var/lib/postgresql/data]

  # The platform's S3-compatible object store (#66): sprites and other blobs, kept as
  # immutable objects. Clients read them straight from it by URL, so its S3 port is
  # published like the gateway's. Each bucket's owner decides what anonymous callers
  # may do; Tamagotchi lets anyone read one object at a time and nothing else. The web
  # console (9001) is not published.
  object-store:
    logging: *default-logging
    image: rustfs/rustfs:1.0.5
    pull_policy: always
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      - "${OBJECT_STORE_PORT:-9400}:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?}
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  tamagotchi-api:
    logging: *default-logging
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-tamagotchi-service:v5.2.0
    pull_policy: always
    # Two interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    # The client credentials come from this service's own secrets file.
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - .env
      - ./secrets/tamagotchi-service.env
    environment:
      POSTGRES_HOST: tamagotchi-db
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
      # false, the default: health statistics are validated with Package Registry's
      # ListStatDefinitions over gRPC through the broker; true keeps the built-in mock.
      PackageRegistry__UseMock: ${USE_MOCK_PACKAGE_REGISTRY:-false}
      # Sprite uploads (POST /api/v1/tamagotchi-sprites) go to the object store with its
      # keys; spriteUrl then accepts only URLs under SPRITES_PUBLIC_BASE_URL, where clients
      # load the images. Set SPRITES_PUBLIC_BASE_URL in .env for clients on other machines.
      SPRITES_ENDPOINT: http://object-store:9000
      SPRITES_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?}
      SPRITES_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?}
      SPRITES_PUBLIC_BASE_URL: ${SPRITES_PUBLIC_BASE_URL:-http://localhost:${OBJECT_STORE_PORT:-9400}/sprites}
    depends_on:
      service-discovery:
        condition: service_healthy
      tamagotchi-db:
        condition: service_healthy
      object-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tamagotchi-db:
    <<: *database-proxy
    environment: {DB_NODE_1: tamagotchi-db-1, DB_NODE_2: tamagotchi-db-2}
    depends_on:
      tamagotchi-db-1: {condition: service_healthy}
      tamagotchi-db-2: {condition: service_healthy}

  tamagotchi-db-1:
    <<: *patroni
    environment: &tamagotchi-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: tamagotchi
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
      PATRONI_NAME: tamagotchi-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: tamagotchi-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: tamagotchi-db-1:5432
    volumes: [tamagotchi-db-1-data:/var/lib/postgresql/data]

  tamagotchi-db-2:
    <<: *patroni
    environment:
      <<: *tamagotchi-db-environment
      PATRONI_NAME: tamagotchi-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: tamagotchi-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: tamagotchi-db-2:5432
    volumes: [tamagotchi-db-2-data:/var/lib/postgresql/data]

  notification-api:
    logging: *default-logging
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-notification-service:v5.1.0
    pull_policy: always
    # Two interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    # The client credentials come from this service's own secrets file. /status measures
    # load against these limits (C# services: 1 CPU, 512M).
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [internal]
    env_file:
      - .env
      - ./secrets/notification-service.env
    environment:
      POSTGRES_HOST: notification-db
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      # Redis is found through the Sentinels under the group name notification, with the same
      # settings as Monster Raid: the service writes only to the primary the Sentinels name.
      REDIS_MODE: sentinel
      REDIS_SENTINEL_ADDRS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: notification
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD}
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      service-discovery:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    <<: *database-proxy
    environment: {DB_NODE_1: notification-db-1, DB_NODE_2: notification-db-2}
    depends_on:
      notification-db-1: {condition: service_healthy}
      notification-db-2: {condition: service_healthy}

  notification-db-1:
    <<: *patroni
    environment: &notification-db-environment
      <<: *patroni-environment
      PATRONI_SCOPE: notification
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      PATRONI_NAME: notification-db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: notification-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: notification-db-1:5432
    volumes: [notification-db-1-data:/var/lib/postgresql/data]

  notification-db-2:
    <<: *patroni
    environment:
      <<: *notification-db-environment
      PATRONI_NAME: notification-db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: notification-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: notification-db-2:5432
    volumes: [notification-db-2-data:/var/lib/postgresql/data]

  # The initial primary of the Sentinel group notification, set up like map-redis, with the
  # append-only file it always had.
  notification-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks:
      internal:
        ipv4_address: 10.89.200.31
    command:
      - redis-server
      - --requirepass
      - ${NOTIFICATION_REDIS_PASSWORD}
      - --masterauth
      - ${NOTIFICATION_REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${NOTIFICATION_REDIS_PASSWORD}
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  notification-redis-replica:
    logging: *default-logging
    image: redis:8-alpine
    networks:
      internal:
        ipv4_address: 10.89.200.32
    command:
      - redis-server
      - --replicaof
      - 10.89.200.31
      - "6379"
      - --requirepass
      - ${NOTIFICATION_REDIS_PASSWORD}
      - --masterauth
      - ${NOTIFICATION_REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${NOTIFICATION_REDIS_PASSWORD}
    volumes:
      - notification-redis-replica-data:/data
    depends_on:
      notification-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  sentinel-1:
    <<: *sentinel
    hostname: sentinel-1
    networks:
      internal:
        ipv4_address: 10.89.200.41

  sentinel-2:
    <<: *sentinel
    hostname: sentinel-2
    networks:
      internal:
        ipv4_address: 10.89.200.42

  sentinel-3:
    <<: *sentinel
    hostname: sentinel-3
    networks:
      internal:
        ipv4_address: 10.89.200.43

  cache-1:
    <<: *cache-node

  cache-2:
    <<: *cache-node

  cache-3:
    <<: *cache-node

  # A fourth node for the sharding demo, started only on request:
  #   docker compose --profile cache-demo up -d cache-4
  # and then added to the broker's ring through its admin listener (POST /cache/nodes).
  cache-4:
    <<: *cache-node
    profiles: [cache-demo]

  # Observability (observability/): the OpenTelemetry Collector receives traces and metrics
  # over OTLP and reads every container's log file, and hands them to Tempo, Prometheus and
  # Loki; Grafana shows all three. Only Grafana is published, on loopback.
  # The warehouse (Analytics in the README). HTTP on loopback for the demo; the ETL writes as
  # etl, Grafana reads as the read-only grafana user of infra/clickhouse/users.d.
  clickhouse:
    logging: *default-logging
    image: clickhouse/clickhouse-server:25.8.33.6
    profiles: [analytics]
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_USER: etl
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/platform.xml:/etc/clickhouse-server/config.d/platform.xml:ro
      - ./infra/clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 1G

  # Airflow's own metadata: tooling, not product data, so one node without a replica.
  airflow-db:
    logging: *default-logging
    image: postgres:17.6-alpine
    profiles: [analytics]
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U airflow -d airflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  # Once per start: Airflow's database migration, the warehouse migrations, the admin user.
  airflow-init:
    <<: *airflow
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        python -m etl migrate
        airflow users list | grep -qw "$${AIRFLOW_ADMIN_USER}" || airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --role Admin --firstname Airflow --lastname Admin --email admin@tamagotchi.local
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
    depends_on:
      airflow-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # The UI on loopback, and the Execution API the tasks report to.
  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      <<: *airflow-depends-on
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  otel-collector:
    logging: *default-logging
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.165.0
    # Root, because only root may read Docker's log files.
    user: "0:0"
    networks: [internal]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # Its Redis receivers read INFO from every Redis node and Sentinel.
    environment:
      MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
      MONSTER_RAID_REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD}
      NOTIFICATION_REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD}
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # From Git Bash on Windows, run compose with MSYS_NO_PATHCONV=1 so this path is kept.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-collector-data:/var/lib/otelcol
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    logging: *default-logging
    restart: unless-stopped
    image: prom/prometheus:v3.16.0
    networks: [internal]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      # Tempo's metrics generator writes span metrics and the service graph here.
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    logging: *default-logging
    restart: unless-stopped
    image: grafana/loki:3.6.20
    networks: [internal]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 1G

  tempo:
    logging: *default-logging
    restart: unless-stopped
    # Traces, read through Grafana: trace search, TraceQL, Traces Drilldown and the service
    # graph. Internal only; Grafana is its UI.
    image: grafana/tempo:2.10.10
    # The image runs as an unprivileged user that cannot write a fresh named volume.
    user: "0:0"
    networks: [internal]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # No healthcheck: the image has no shell or HTTP client (like Loki's), so dependents wait
    # for it to start and the collector's exporter retries until it accepts spans.
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    logging: *default-logging
    restart: unless-stopped
    image: grafana/grafana:13.2.6
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Anyone on this machine may look, including in Explore, where a log line's traceId opens
      # its trace; saving anything needs the admin login. Grafana is reachable on loopback only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # The Analytics dashboard reads the warehouse through this plugin, installed before
      # Grafana serves, pinned like every image.
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      # The first start on an empty volume runs about 800 database migrations, which takes
      # minutes on a busy machine; failed probes during this window do not count.
      start_period: 10m
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  # Published listeners: the gateway, both Guild sockets, the object store, and loopback-only Discovery,
  # broker admin and Grafana.
  edge:
  # Every container. No route to the internet, and nothing on it is published. The subnet is
  # fixed, outside Docker's default address pools, so the Redis nodes and Sentinels keep the same
  # address across restarts (10.89.200.0/24); every other container gets one from ip_range.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 10.89.0.0/16
          ip_range: 10.89.0.0/17

volumes:
  service-discovery-data:
  map-redis-data:
  map-redis-replica-data:
  monster-raid-data:
  monster-raid-redis-data:
  monster-raid-redis-replica-data:
  guild-data:
