# Every container logs through the json-file driver, rotated, with its name as tag: the
# OpenTelemetry Collector reads these files (Docker Desktop defaults to the local driver, which
# it cannot read) and sends the lines to Loki.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  api-gateway:
    logging: *default-logging
    image: grdz/gateway:4.1.0
    pull_policy: always
    # Client traffic arrives on edge; the services and the registry are on internal.
    networks: [edge, internal]
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    volumes:
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    # The api-gateway client credentials, with which the gateway authenticates its
    # Send calls so that the broker accepts the user identity it passes on.
    env_file:
      - .env
      - ./secrets/api-gateway.env
    # Every request goes to the broker, which picks the instance; the gateway keeps
    # no instance list and reaches the broker at broker:9090.
    depends_on:
      service-discovery:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  service-discovery:
    logging: *default-logging
    image: grdz/service-discovery:4.1.0
    pull_policy: always
    restart: unless-stopped
    # Nothing calls it from outside. It joins edge only to reach the Discord webhook,
    # because the internal network has no route to the internet, and its port is
    # bound to loopback so the catalogue can be read from the host and nowhere else.
    networks: [edge, internal]
    ports:
      - "127.0.0.1:8500:8080"
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LOAD_ALERT_THRESHOLD: ${LOAD_ALERT_THRESHOLD:-0.8}
      SELF_PRESERVATION: ${SELF_PRESERVATION:-off}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Not optional: there is no heartbeat, so a registry that loses its state file
    # loses the fleet until every service is restarted.
    volumes:
      - service-discovery-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  broker:
    logging: *default-logging
    image: grdz/broker:4.5.0
    pull_policy: always
    restart: unless-stopped
    # Carries every client request, every call between services and every event:
    # gRPC on 9090 and health, status and admin on 8080, both on the internal network.
    # It joins edge only to publish its admin endpoints (/status, /topics,
    # /dead-letters), bound to loopback so they can be read from the host and
    # nowhere else.
    networks: [internal, edge]
    ports:
      - "127.0.0.1:8501:8080"
    environment:
      BROKER_DATABASE_URL: postgresql://${BROKER_DB_USER}:${BROKER_DB_PASSWORD}@broker-db:5432/${BROKER_DB_NAME}
    depends_on:
      service-discovery:
        condition: service_healthy
      broker-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The durable event store: queued events survive a broker restart.
  broker-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${BROKER_DB_NAME}
      POSTGRES_USER: ${BROKER_DB_USER}
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD}
    volumes:
      - broker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-management-api:
    logging: *default-logging
    image: sanda2004/user-management-service:4.0.0
    pull_policy: always
    deploy:
      replicas: 2
    networks: [internal]
    environment:
      REQUEST_TIMEOUT_SECONDS: 4
    env_file:
      - .env
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}:/run/secrets/jwt-private.pem:ro
      - ./config/service-clients.yaml:/app/config/service-clients.yaml:ro
    depends_on:
      service-discovery:
        condition: service_healthy
      user-management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-management-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
    volumes:
      - user-management-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  battle-api:
    logging: *default-logging
    image: sanda2004/battle-service:3.0.0
    pull_policy: always
    deploy:
      replicas: 2
    networks: [internal]
    environment:
      REQUEST_TIMEOUT_SECONDS: 4
    env_file:
      - .env
      - ./secrets/battle-service.env
    depends_on:
      service-discovery:
        condition: service_healthy
      battle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  battle-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${BATTLE_DB_NAME}
      POSTGRES_USER: ${BATTLE_DB_USER}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD}
    volumes:
      - battle-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  map-api:
    logging: *default-logging
    image: grdz/map-service:3.0.0
    pull_policy: always
    # Three interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    deploy:
      replicas: 3
    networks: [internal]
    env_file:
      - .env
      - ./secrets/map-service.env
    environment:
      REDIS_ADDR: map-redis:6379
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      service-discovery:
        condition: service_healthy
      map-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  map-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks: [internal]
    command: ["redis-server", "--requirepass", "${MAP_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  monster-raid-api:
    logging: *default-logging
    image: grdz/monster-raid-service:3.0.0
    pull_policy: always
    # Three interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    deploy:
      replicas: 3
    networks: [internal]
    env_file:
      - .env
      - ./secrets/monster-raid-service.env
    environment:
      POSTGRES_HOST: monster-raid-db
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
      REDIS_ADDR: monster-raid-redis:6379
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      service-discovery:
        condition: service_healthy
      monster-raid-db:
        condition: service_healthy
      monster-raid-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  monster-raid-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD}
    volumes:
      - monster-raid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  monster-raid-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks: [internal]
    command: ["redis-server", "--requirepass", "${MONSTER_RAID_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MONSTER_RAID_REDIS_PASSWORD}
    volumes:
      - monster-raid-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  guild-api-1:
    logging: *default-logging
    image: cosmak47/pad-guild-service:3.0.0
    pull_policy: always
    networks: [edge, internal]
    env_file:
      - ./secrets/guild-service.env
    environment:
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL_1:-ws://localhost:${GUILD_CHAT_PORT_1:-8081}}
      REQUEST_TIMEOUT_SECONDS: 4
    ports:
      - "${GUILD_CHAT_PORT_1:-8081}:8082"
    depends_on:
      guild-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  guild-api-2:
    logging: *default-logging
    image: cosmak47/pad-guild-service:3.0.0
    pull_policy: always
    networks: [edge, internal]
    env_file:
      - ./secrets/guild-service.env
    environment:
      DATABASE_URL: postgres://${GUILD_DB_USER}:${GUILD_DB_PASSWORD}@guild-db:5432/${GUILD_DB_NAME}?sslmode=disable
      PUBLIC_WS_URL: ${GUILD_PUBLIC_WS_URL_2:-ws://localhost:${GUILD_CHAT_PORT_2:-8083}}
      REQUEST_TIMEOUT_SECONDS: 4
    ports:
      - "${GUILD_CHAT_PORT_2:-8083}:8082"
    depends_on:
      guild-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  guild-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${GUILD_DB_NAME}
      POSTGRES_USER: ${GUILD_DB_USER}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD}
    volumes:
      - guild-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  package-registry-api:
    logging: *default-logging
    image: cosmak47/pad-package-registry-service:3.0.0
    pull_policy: always
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - ./secrets/package-registry-service.env
    environment:
      DATABASE_URL: postgres://${PACKAGE_REGISTRY_DB_USER}:${PACKAGE_REGISTRY_DB_PASSWORD}@package-registry-db:5432/${PACKAGE_REGISTRY_DB_NAME}?sslmode=disable
      ADMIN_USER_IDS: ${PACKAGE_REGISTRY_ADMIN_USER_IDS:-}
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      package-registry-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  package-registry-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD}
    volumes:
      - package-registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  tamagotchi-api:
    logging: *default-logging
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-tamagotchi-service:v3.0.1
    pull_policy: always
    # Two interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    # The client credentials come from this service's own secrets file.
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - .env
      - ./secrets/tamagotchi-service.env
    environment:
      POSTGRES_HOST: tamagotchi-db
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
      # Below the gateway's 5 second upstream timeout, so a slow request ends
      # with this service's own REQUEST_TIMEOUT rather than the gateway's.
      REQUEST_TIMEOUT_SECONDS: 4
      PackageRegistry__UseMock: ${USE_MOCK_PACKAGE_REGISTRY:-false}
    depends_on:
      service-discovery:
        condition: service_healthy
      tamagotchi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tamagotchi-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
    volumes:
      - tamagotchi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-api:
    logging: *default-logging
    platform: ${SERVICE_PLATFORM:-linux/amd64}
    image: johnnyc05/pad-notification-service:v3.0.0
    pull_policy: always
    # Two interchangeable replicas, reachable only through the gateway: no
    # published port, and no container_name, which Compose rejects alongside
    # replicas. Each one registers itself with Service Discovery at startup.
    # The client credentials come from this service's own secrets file.
    deploy:
      replicas: 2
    networks: [internal]
    env_file:
      - .env
      - ./secrets/notification-service.env
    environment:
      POSTGRES_HOST: notification-db
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      REDIS_ADDR: notification-redis:6379
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD}
      REQUEST_TIMEOUT_SECONDS: 4
    depends_on:
      service-discovery:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    logging: *default-logging
    image: postgres:17-alpine
    networks: [internal]
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-redis:
    logging: *default-logging
    image: redis:8-alpine
    networks: [internal]
    command: ["redis-server", "--requirepass", "${NOTIFICATION_REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${NOTIFICATION_REDIS_PASSWORD}
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Observability (observability/): the OpenTelemetry Collector receives traces and metrics
  # over OTLP and reads every container's log file, and hands them to Jaeger, Prometheus and
  # Loki; Grafana shows all three. Only Grafana and the Jaeger UI are published, on loopback.
  otel-collector:
    logging: *default-logging
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.165.0
    # Root, because only root may read Docker's log files.
    user: "0:0"
    networks: [internal]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # From Git Bash on Windows, run compose with MSYS_NO_PATHCONV=1 so this path is kept.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-collector-data:/var/lib/otelcol
    depends_on:
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    logging: *default-logging
    restart: unless-stopped
    image: prom/prometheus:v3.16.0
    networks: [internal]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    logging: *default-logging
    restart: unless-stopped
    image: grafana/loki:3.6.20
    networks: [internal]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 1G

  jaeger:
    logging: *default-logging
    restart: unless-stopped
    # 2.21 and later serve only the v3 query API, which Grafana's Jaeger datasource does not
    # read yet. Traces are kept in memory: 768M restart starts empty.
    image: jaegertracing/jaeger:2.20.0
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:16686/"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 768M

  grafana:
    logging: *default-logging
    restart: unless-stopped
    image: grafana/grafana:13.2.6
    networks: [edge, internal]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Anyone on this machine may look, including in Explore, where a log line's traceId opens
      # its trace; saving anything needs the admin login. Grafana is reachable on loopback only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  # Published listeners: the gateway, both Guild sockets, and loopback-only Discovery,
  # broker admin, Grafana and the Jaeger UI.
  edge:
  # Every container. No route to the internet, and nothing on it is published.
  internal:
    internal: true

volumes:
  service-discovery-data:
  broker-db-data:
  user-management-data:
  battle-data:
  map-redis-data:
  monster-raid-data:
  monster-raid-redis-data:
  guild-data:
  package-registry-data:
  tamagotchi-data:
  notification-data:
  notification-redis-data:
  otel-collector-data:
  prometheus-data:
  loki-data:
  grafana-data:
