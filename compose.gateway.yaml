# Gateway image may be published by its owner or built locally from gateway main.
services:
  api-gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to the published gateway image}
    pull_policy: always
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    environment:
      GATEWAY_CONFIG_PATH: /app/config/gateway.yaml
      GATEWAY_WORKERS: "1"
    volumes:
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    networks: [default, issuer]
    depends_on:
      user-management-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
