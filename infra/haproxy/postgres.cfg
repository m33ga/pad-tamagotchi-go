global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode tcp
    timeout connect 2s
    timeout client 1h
    timeout server 1h
    timeout check 2s
    # A backend must pass its Patroni role check after DNS recovery as well as at startup.
    default-server init-state fully-down inter 1s fall 2 rise 1 on-marked-down shutdown-sessions

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend write
    bind *:5432
    default_backend primary

frontend read
    bind *:5433
    # Prefer a streaming replica. Use the primary only while no replica is ready.
    use_backend primary if { nbsrv(replicas) lt 1 }
    default_backend replicas

backend primary
    option httpchk GET /primary
    http-check expect status 200
    server node1 "${DB_NODE_1}:5432" check port 8008 resolvers docker init-addr last,libc,none
    server node2 "${DB_NODE_2}:5432" check port 8008 resolvers docker init-addr last,libc,none

backend replicas
    option httpchk GET /replica
    http-check expect status 200
    server node1 "${DB_NODE_1}:5432" check port 8008 resolvers docker init-addr last,libc,none
    server node2 "${DB_NODE_2}:5432" check port 8008 resolvers docker init-addr last,libc,none

frontend health
    bind *:8404
    mode http
    http-request return status 503 content-type text/plain string DOWN if { nbsrv(primary) lt 1 }
    http-request return status 200 content-type text/plain string UP
