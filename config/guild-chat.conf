# Only the Guild WebSocket listener is reachable through this published relay.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_tokens off;
    # Tickets are credentials: never log the request URL or query string.
    access_log off;
    error_log /dev/null crit;

    location ~ ^/ws/v1/guilds/[0-9a-fA-F-]+/chat$ {
        proxy_pass http://guild-api:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
