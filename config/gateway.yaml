# Gateway configuration for the Tamagotchi Go compose deployment.
# Reference: gateway/docs/spec.md, section 15. Every key not present here has a default.
#
# Routing policy lives here and only here: path prefixes, public operations, timeouts,
# concurrency limits and authentication. Instance addresses come from Service Discovery
# (gateway/docs/spec.md, section 10). The url: entries below are NOT live: they are a
# cold-start fallback, used only until the first successful catalogue read and never
# again after it. A service that registers under a name that is not a key under
# services: is ignored, so a service cannot register itself into another's prefix.

auth:
  jwks_url: http://user-management-api:8080/.well-known/jwks.json
  issuer: tamagotchi-go
  audience: tamagotchi-go
  algorithms: [RS256]

services:
  user-management:
    url: http://user-management-api:8080
    public:
      - GET /.well-known/jwks.json            # public key discovery
      - POST /api/v1/users                    # register
      - POST /api/v1/auth/sessions            # login
      - POST /api/v1/auth/session-refreshes   # refresh
      - POST /api/v1/oauth2/token             # service client credentials
  battle:
    url: http://battle-api:8080
  tamagotchi:
    url: http://tamagotchi-api:8080
  notification:
    url: http://notification-api:8080
  map:
    url: http://map-api:8080
    public:
      - GET /docs                             # Swagger UI
      - GET /openapi.json                     # generated contract
  monster-raid:
    url: http://monster-raid-api:8080
    public:
      - GET /docs                             # Swagger UI
      - GET /openapi.json                     # generated contract
  guild:
    url: http://guild-api-1:8081
  package-registry:
    url: http://package-registry-api:8082
