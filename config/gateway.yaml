# Gateway client allowlist for Lab 4; gateway/docs/spec.md sections 4 and 12.
# Release together with gateway #27, after all outbound-to-broker migrations finish.
# Routing policy only: the broker owns instance addresses and per-instance limits.
# Public and authenticated entries are METHOD /path-template; all others return 404.

auth:
  jwks_url: http://user-management-api:8080/.well-known/jwks.json
  issuer: tamagotchi-go
  audience: tamagotchi-go
  algorithms: [RS256]

services:
  user-management:
    public:
      - GET /.well-known/jwks.json
      - POST /api/v1/users                    # register
      - POST /api/v1/auth/sessions            # login
      - POST /api/v1/auth/session-refreshes   # refresh
    authenticated:
      - DELETE /api/v1/auth/sessions/current
      - GET /api/v1/users/{userId}
      - PATCH /api/v1/users/{userId}
      - GET /api/v1/users/{userId}/relationships
      - GET /api/v1/users/{userId}/relationships/{otherUserId}
      - POST /api/v1/users/{userId}/friend-requests
      - POST /api/v1/users/{userId}/friend-requests/{requestId}/responses
      - PUT /api/v1/users/{userId}/enemies/{enemyUserId}
      - DELETE /api/v1/users/{userId}/enemies/{enemyUserId}
      - GET /api/v1/users/{userId}/balances
      - GET /api/v1/users/{userId}/packages
      - PUT /api/v1/users/{userId}/packages/{packageId}
  battle:
    authenticated:
      - POST /api/v1/battle-requests
      - GET /api/v1/battle-requests/{battleRequestId}
      - GET /api/v1/users/{userId}/battle-requests
      - POST /api/v1/battle-requests/{battleRequestId}/responses
      - GET /api/v1/battles/{battleId}
      - GET /api/v1/users/{userId}/battles
      - POST /api/v1/battles/{battleId}/actions
      - POST /api/v1/battles/{battleId}/forfeitures
  tamagotchi:
    authenticated:
      - GET /api/v1/tamagotchi-combat-types
      - POST /api/v1/tamagotchis
      - GET /api/v1/tamagotchis/{tamagotchiId}
      - PATCH /api/v1/tamagotchis/{tamagotchiId}
      - GET /api/v1/users/{userId}/tamagotchis
      - GET /api/v1/users/{userId}/primary-tamagotchi
      - PUT /api/v1/users/{userId}/primary-tamagotchi
      - PATCH /api/v1/tamagotchis/{tamagotchiId}/health-stats
  notification:
    authenticated:
      - GET /api/v1/users/{userId}/notification-devices
      - PUT /api/v1/users/{userId}/notification-devices/{deviceId}
      - DELETE /api/v1/users/{userId}/notification-devices/{deviceId}
      - GET /api/v1/users/{userId}/notification-preferences
      - PUT /api/v1/users/{userId}/notification-preferences
  map:
    authenticated:
      - PUT /api/v1/users/{userId}/location
      - GET /api/v1/users/{userId}/map
      - DELETE /api/v1/users/{userId}/location
  monster-raid:
    authenticated:
      - GET /api/v1/guilds/{guildId}/raids
      - POST /api/v1/guilds/{guildId}/raids
      - GET /api/v1/raids/{raidId}
      - POST /api/v1/raids/{raidId}/participants
      - GET /api/v1/raids/{raidId}/participants
      - POST /api/v1/raids/{raidId}/attacks
      - GET /api/v1/raids/{raidId}/result
  guild:
    authenticated:
      - GET /api/v1/guilds
      - POST /api/v1/guilds
      - GET /api/v1/guilds/{guildId}
      - PATCH /api/v1/guilds/{guildId}
      - DELETE /api/v1/guilds/{guildId}
      - GET /api/v1/users/{userId}/guilds
      - GET /api/v1/guilds/{guildId}/members
      - GET /api/v1/guilds/{guildId}/members/{userId}
      - PATCH /api/v1/guilds/{guildId}/members/{userId}
      - DELETE /api/v1/guilds/{guildId}/members/{userId}
      - POST /api/v1/guilds/{guildId}/ownership-transfers
      - POST /api/v1/guilds/{guildId}/invitations
      - GET /api/v1/guilds/{guildId}/invitations
      - GET /api/v1/users/{userId}/guild-invitations
      - POST /api/v1/guilds/{guildId}/invitations/{invitationId}/responses
      - GET /api/v1/guilds/{guildId}/messages
      - POST /api/v1/guilds/{guildId}/chat-sessions
  package-registry:
    authenticated:
      - GET /api/v1/packages
      - POST /api/v1/packages
      - GET /api/v1/packages/{packageId}
      - PATCH /api/v1/packages/{packageId}
      - POST /api/v1/packages/{packageId}/moderators
      - DELETE /api/v1/packages/{packageId}/moderators/{userId}
      - PUT /api/v1/packages/{packageId}/stat-definitions
      - PUT /api/v1/packages/{packageId}/battle-boosts
      - GET /api/v1/packages/{packageId}/battle-boosts
      - GET /api/v1/raid-configurations
      - POST /api/v1/raid-configurations
      - GET /api/v1/raid-configurations/{raidConfigurationId}
      - PATCH /api/v1/raid-configurations/{raidConfigurationId}
      - POST /api/v1/raid-schedules
      - GET /api/v1/raid-schedules
      - GET /api/v1/raid-schedules/{scheduleId}
      - PATCH /api/v1/raid-schedules/{scheduleId}
