# Loki as a single process with local storage, for the platform's container logs. They arrive
# over OTLP from the OpenTelemetry Collector.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h
  # Labels: the service and its instance, from the line's service and instanceId, and the
  # level. Every other field of a line (event, correlationId, traceId, status, ...) is kept as
  # structured metadata, searchable without becoming a label.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name, service.instance.id]
    log_attributes:
      - action: index_label
        attributes: [level]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
