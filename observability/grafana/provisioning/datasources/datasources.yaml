# Provisioned on every start; $$ escapes Grafana's own variables from environment expansion.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # A line's traceId opens its trace in Jaeger.
      derivedFields:
        - name: traceId
          matcherType: label
          matcherRegex: traceId
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: Open the trace

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # A span opens the log lines of its service written in the same trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | traceId="$${__trace.traceId}"'
