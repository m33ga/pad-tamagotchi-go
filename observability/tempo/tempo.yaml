# Tempo as a single process with local storage. It receives every trace from the OpenTelemetry
# Collector and serves Grafana: trace search, TraceQL, Traces Drilldown and the service graph.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Blocks are cut every five minutes, so a restart loses at most that much from the WAL.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

# Span metrics and the service graph go to Prometheus (remote write). Local blocks answer
# TraceQL metrics queries, which Traces Drilldown is built on.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
