name: Task / Feature
description: A piece of work to be done, such as a new feature, improvement or chore.
title: "[task]: "
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
      placeholder: Describe the task...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: services
    attributes:
      label: Affected service(s)
      multiple: true
      options:
        - User Management Service
        - Battle Service
        - Tamagotchi Service
        - Notification Service
        - Map Service
        - Monster Raid Service
        - Guild Service
        - Package Registry Service
        - CPR / infrastructure
    validations:
      required: true

  - type: input
    id: lab
    attributes:
      label: Lab
      description: Which lab is this task part of?
      placeholder: "e.g. Lab 1"
    validations:
      required: false
