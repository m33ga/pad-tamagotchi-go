name: Bug Report
description: Something is broken or behaves unexpectedly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Tell us what you saw...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: services
    attributes:
      label: Affected service(s)
      multiple: true
      options:
        - User Management Service
        - Battle Service
        - Tamagotchi Service
        - Notification Service
        - Map Service
        - Monster Raid Service
        - Guild Service
        - Package Registry Service
        - CPR / infrastructure
    validations:
      required: true
