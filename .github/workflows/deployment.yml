name: Gateway Deployment

on:
  pull_request:
    paths:
      - compose.yaml
      - .env.example
      - .gitmodules
      - gateway
      - config/**
      - collections/**
      - scripts/**
      - tests/**
      - .github/workflows/deployment.yml
  push:
    branches: [main]
    paths:
      - compose.yaml
      - .env.example
      - .gitmodules
      - gateway
      - config/**
      - collections/**
      - scripts/**
      - tests/**
      - .github/workflows/deployment.yml

permissions:
  contents: read

jobs:
  contract:
    name: Deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify rendered networks, ports, credentials and Postman authentication
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  integration:
    name: Published stack
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Start and verify the isolated complete deployment
        run: python3 tests/deployment_smoke.py
